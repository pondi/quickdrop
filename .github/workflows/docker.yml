name: Docker Build and Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (leave empty for latest release)'
        required: false
        type: string
      channel:
        description: 'Release channel (latest or next)'
        required: false
        type: choice
        options:
          - latest
          - next
        default: 'latest'

jobs:
  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get version and channel
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION=${GITHUB_REF#refs/tags/}
            if [[ "${{ github.event.release.prerelease }}" == "true" ]]; then
              echo "CHANNEL=next" >> $GITHUB_OUTPUT
            else
              echo "CHANNEL=latest" >> $GITHUB_OUTPUT
            fi
          else
            VERSION=${{ inputs.version || 'latest' }}
            echo "CHANNEL=${{ inputs.channel }}" >> $GITHUB_OUTPUT
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/quickdrop:${{ steps.get_version.outputs.VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/quickdrop:${{ steps.get_version.outputs.CHANNEL }} 